name: Build Jo's Diner Android APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Web Dependencies
        run: npm ci --include=dev

      - name: Prepare Android Project & SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          sed -i '/org.gradle.java.home/d' android/gradle.properties || true
          chmod +x android/gradlew
          cat android/local.properties
          mkdir -p build-apks

      - name: Build Jo's Diner Team APK
        run: |
          node scripts/prepare-app.js team
          npx vite build
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx cap sync android || ./node_modules/.bin/cap sync android || true
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/*.apk build-apks/JosDiners-Team.apk
        env:
          VITE_APP_TARGET: team

      - name: Build Jo's Diner Customer APK
        run: |
          node scripts/prepare-app.js customer
          npx vite build
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx cap sync android || ./node_modules/.bin/cap sync android || true
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/*.apk build-apks/JosDiners-Customer.apk
        env:
          VITE_APP_TARGET: customer

      - name: Upload Jo's Diner Team APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: JosDiners-Team-APK
          path: build-apks/JosDiners-Team.apk
          retention-days: 14

      - name: Upload Jo's Diner Customer APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: JosDiners-Customer-APK
          path: build-apks/JosDiners-Customer.apk
          retention-days: 14

      - name: Delete existing app-latest Release (if any)
        run: |
          gh release delete app-latest --yes || true
          git push --delete origin app-latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: "Jo's Diner Mobile Apps (Latest)"
          body: |
            ## 📱 Jo's Diner Android APKs

            Download the latest builds below:

            | App | Description |
            |-----|-------------|
            | **JosDiners-Customer.apk** | Customer ordering app — browse menu, reserve halls, track deliveries |
            | **JosDiners-Team.apk** | Staff & Rider internal portal — courier dispatch, kitchen KDS, POS |

            **Installation:** Download the APK → open the file on your Android device → tap Install.
            > You may need to allow "Install from Unknown Sources" in your Android settings.

            ---
            *Auto-built by GitHub Actions on every push to main.*
          files: |
            build-apks/JosDiners-Customer.apk
            build-apks/JosDiners-Team.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
