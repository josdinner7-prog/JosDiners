name: Build Jo's Diner Rider APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Web Dependencies
        run: npm ci --include=dev

      - name: Build Web Assets (Vite)
        run: npx vite build

      - name: Prepare Android Project & SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          sed -i '/org.gradle.java.home/d' android/gradle.properties || true
          chmod +x android/gradlew
          cat android/local.properties

      - name: Sync Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx cap sync android || ./node_modules/.bin/cap sync android || true

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JosDiners-Rider-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
